[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Retries migrate and can fall back from private → public DB URL.
startCommand = "sh ./scripts/railway-start.sh"
healthcheckPath = "/api/v1/health/live"
# Give migrate retries + Nest boot enough time before Railway fails the check.
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 8
