# Docker is OPTIONAL.
# Mode A (default): use local PostgreSQL 18 + npm run start:dev — do not start Compose Postgres.
#
# Profiles:
#   optional-deps — redis, minio, mailpit (safe alongside local PG 18)
#   docker-db     — Compose Postgres only (conflicts with local PG on :5432)
#   api           — containerised API (+ pulls docker-db / redis dependencies)

services:
  postgres:
    profiles: ["docker-db", "api"]
    image: postgres:17-alpine
    container_name: guardtrak-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardtrak
      POSTGRES_PASSWORD: guardtrak_dev_password
      POSTGRES_DB: guardtrak_db
    ports:
      - "5432:5432"
    volumes:
      - guardtrak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardtrak -d guardtrak_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["optional-deps", "api"]
    image: redis:7-alpine
    container_name: guardtrak-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - guardtrak_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ["optional-deps", "api"]
    image: minio/minio:latest
    container_name: guardtrak-api-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guardtrak
      MINIO_ROOT_PASSWORD: guardtrak_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - guardtrak_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    profiles: ["optional-deps", "api"]
    image: axllent/mailpit:latest
    container_name: guardtrak-api-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardtrak-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://guardtrak:guardtrak_dev_password@postgres:5432/guardtrak_db?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      EMAIL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET: guardtrak-evidence
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: guardtrak
      STORAGE_SECRET_KEY: guardtrak_minio_password
      STORAGE_REGION: us-east-1
    ports:
      - "3000:3000"
    volumes:
      - guardtrak_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  guardtrak_postgres_data:
  guardtrak_redis_data:
  guardtrak_minio_data:
  guardtrak_storage:
