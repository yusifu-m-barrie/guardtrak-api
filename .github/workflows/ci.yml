name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: guardtrak
          POSTGRES_PASSWORD: guardtrak_ci_password
          POSTGRES_DB: guardtrak_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardtrak -d guardtrak_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://guardtrak:guardtrak_ci_password@localhost:5432/guardtrak_db?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_ISSUER: guardtrak-api
      JWT_AUDIENCE: guardtrak-clients
      REDIS_ENABLED: "false"
      QUEUE_ENABLED: "true"
      EMAIL_ENABLED: "false"
      FCM_ENABLED: "false"
      APNS_ENABLED: "false"
      WS_ENABLED: "true"
      METRICS_ENABLED: "true"
      STORAGE_PROVIDER: local
      AUTH_ALLOW_DEV_OTP_OUTPUT: "true"
      AUTH_NEW_DEVICE_AUTO_APPROVE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed
        continue-on-error: true

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker publish placeholder — enable when registry credentials are configured."

  deploy:
    if: false
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - run: echo "Deploy placeholder — wire Hostinger VPS or container registry when ready."
