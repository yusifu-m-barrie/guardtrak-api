# Optional production Compose stack.
# Preferred Mode B path is PM2 + host/managed PostgreSQL (see docs/deployment.md).
# This file does not affect Mode A local PostgreSQL 18 development.

services:
  postgres:
    image: postgres:17-alpine
    container_name: guardtrak-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardtrak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-guardtrak_db}
    volumes:
      - guardtrak_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-guardtrak} -d ${POSTGRES_DB:-guardtrak_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: guardtrak-prod-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - guardtrak_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardtrak-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  guardtrak_prod_postgres_data:
  guardtrak_prod_redis_data:
